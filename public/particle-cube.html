<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Particle Cube</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
    }

    #app {
      width: 100vw;
      height: 100vh;
      background: transparent;
      pointer-events: none;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>

<div id="app"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

<script type="module">

import * as THREE from "three";

import {
  EffectComposer
} from "three/addons/postprocessing/EffectComposer.js";

import {
  RenderPass
} from "three/addons/postprocessing/RenderPass.js";

import {
  UnrealBloomPass
} from "three/addons/postprocessing/UnrealBloomPass.js";


/* =========================================================
   APP
========================================================= */

const app = document.getElementById("app");


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background = null;


/* =========================================================
   CAMERA SETTINGS
========================================================= */

const ANGLE_Y = 0.55;
const ANGLE_X = 0.28;


/*
  FAR = original position
  FULL = close zoom
*/

const DIST_FAR = 190;
const DIST_FULL = 40;


/* =========================================================
   CAMERA
========================================================= */

function camPosAtDistance(dist) {

  return new THREE.Vector3(
    Math.sin(ANGLE_Y) *
      Math.cos(ANGLE_X) *
      dist,

    Math.sin(ANGLE_X) *
      dist,

    Math.cos(ANGLE_Y) *
      Math.cos(ANGLE_X) *
      dist
  );

}


const camera =
  new THREE.PerspectiveCamera(
    50,
    window.innerWidth /
      window.innerHeight,

    0.1,
    1000
  );


camera.position.copy(
  camPosAtDistance(DIST_FAR)
);

camera.lookAt(0, 0, 0);


/* =========================================================
   RENDERER
========================================================= */

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
    powerPreference:
      "high-performance"
  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setClearColor(
  0x000000,
  0
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

app.appendChild(
  renderer.domElement
);


/* =========================================================
   PARTICLE CUBE
========================================================= */

const count = 9000;

const geometry =
  new THREE.TetrahedronGeometry(
    0.42
  );

const material =
  new THREE.MeshBasicMaterial({
    color: 0x4fc8ff
  });


const swarm =
  new THREE.InstancedMesh(
    geometry,
    material,
    count
  );


const positions = [];

const targets = [];

const dummy =
  new THREE.Object3D();


const particleColor =
  new THREE.Color(0x00aaff);


const s =
  Math.ceil(
    Math.pow(
      count,
      1 / 3
    )
  );


const sep = 2.3;

const off =
  (s * sep) / 2;


/* =========================================================
   PARTICLE POSITIONS
========================================================= */

for (
  let i = 0;
  i < count;
  i++
) {

  const z =
    Math.floor(
      i / (s * s)
    );

  const y =
    Math.floor(
      (i % (s * s)) / s
    );

  const x =
    i % s;


  const tx =
    x * sep - off;

  const ty =
    y * sep - off;

  const tz =
    z * sep - off;


  targets.push(
    new THREE.Vector3(
      tx,
      ty,
      tz
    )
  );


  positions.push(
    new THREE.Vector3(
      tx +
        (Math.random() - 0.5) *
          14,

      ty +
        (Math.random() - 0.5) *
          14,

      tz +
        (Math.random() - 0.5) *
          14
    )
  );


  swarm.setColorAt(
    i,
    particleColor
  );

}


swarm.instanceMatrix.setUsage(
  THREE.DynamicDrawUsage
);

scene.add(swarm);


/* =========================================================
   BLOOM
========================================================= */

const composer =
  new EffectComposer(
    renderer
  );


composer.addPass(
  new RenderPass(
    scene,
    camera
  )
);


const bloomPass =
  new UnrealBloomPass(
    new THREE.Vector2(
      window.innerWidth,
      window.innerHeight
    ),

    0.85,
    0.35,
    0.15
  );


composer.addPass(
  bloomPass
);


/* =========================================================
   SCROLL PROGRESS
========================================================= */

/*
  0 = camera far away

  1 = camera fully zoomed
*/

let scrollProgress = 0;


/* =========================================================
   RECEIVE MESSAGE FROM NEXT.JS
========================================================= */

window.addEventListener(
  "message",
  (event) => {

    /*
      Only accept messages
      from our own website.
    */

    if (
      event.origin !==
      window.location.origin
    ) {
      return;
    }


    if (
      !event.data
    ) {
      return;
    }


    if (
      event.data.type ===
      "cube-scroll-progress"
    ) {

      const value =
        Number(
          event.data.progress
        );


      if (
        Number.isFinite(value)
      ) {

        scrollProgress =
          Math.max(
            0,
            Math.min(
              1,
              value
            )
          );

      }

    }

  }
);


/* =========================================================
   SMOOTH CAMERA
========================================================= */

let currentDistance =
  DIST_FAR;


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

  requestAnimationFrame(
    animate
  );


  /* -----------------------------------------
     PARTICLES ASSEMBLY
  ----------------------------------------- */

  for (
    let i = 0;
    i < count;
    i++
  ) {

    positions[i].lerp(
      targets[i],
      0.35
    );


    dummy.position.copy(
      positions[i]
    );


    dummy.updateMatrix();


    swarm.setMatrixAt(
      i,
      dummy.matrix
    );

  }


  swarm.instanceMatrix.needsUpdate =
    true;


  /* -----------------------------------------
     SCROLL → CAMERA
  ----------------------------------------- */

  const targetDistance =
    DIST_FAR +
    (
      DIST_FULL -
      DIST_FAR
    ) *
    scrollProgress;


  /*
    Smooth camera movement
  */

  currentDistance +=
    (
      targetDistance -
      currentDistance
    ) *
    0.08;


  camera.position.copy(
    camPosAtDistance(
      currentDistance
    )
  );


  camera.lookAt(
    0,
    0,
    0
  );


  /* -----------------------------------------
     SUBTLE ROTATION
  ----------------------------------------- */

  if (
    scrollProgress >= 1
  ) {

    swarm.rotation.y +=
      0.0015;

  }


  composer.render();

}


animate();


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );


    composer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
