<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Particle Cube - Three.js</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; touch-action: none; }
    #app { width: 100vw; height: 100vh; background: transparent; cursor: grab; }
    #app:active { cursor: grabbing; }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
    import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
    import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";

    const app = document.getElementById("app");

    const scene = new THREE.Scene();
    scene.background = null;
    scene.fog = new THREE.Fog(0x0a0e27, 40, 240);

    // Angled orbit — camera never looks straight down the grid axis, so it
    // always reads as a rotating cube, never a "tunnel of spikes".
    const ANGLE_Y = 0.55;
    const ANGLE_X = 0.28;

    // Three-stage dolly-in: far -> reveal -> closer -> full (cinematic) close-up.
    const DIST_FAR    = 190;
    const DIST_STAGE1 = 115;
    const DIST_STAGE2 = 78;
    const DIST_FULL   = 40;

    const STAGE1_DELAY    = 0.3;
    const STAGE1_DURATION = 1.0;  // zoom 1: FAR -> STAGE1
    const HOLD1_DURATION  = 0.4;
    const STAGE2_DURATION = 1.0;  // zoom 2: STAGE1 -> STAGE2
    const HOLD2_DURATION  = 0.4;
    const STAGE3_DURATION = 1.1;  // zoom 3 (full): STAGE2 -> FULL

    function camPosAtDistance(dist) {
      return new THREE.Vector3(
        Math.sin(ANGLE_Y) * Math.cos(ANGLE_X) * dist,
        Math.sin(ANGLE_X) * dist,
        Math.cos(ANGLE_Y) * Math.cos(ANGLE_X) * dist
      );
    }

    const camera = new THREE.PerspectiveCamera(
      50,
      window.innerWidth / window.innerHeight,
      0.1,
      1000
    );
    camera.position.copy(camPosAtDistance(DIST_FAR));
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 0);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    app.appendChild(renderer.domElement);

    const count = 9000;
    const geometry = new THREE.TetrahedronGeometry(0.42);
    const material = new THREE.MeshBasicMaterial({ color: 0x4fc8ff });
    const swarm = new THREE.InstancedMesh(geometry, material, count);

    const positions = [];
    const dummy = new THREE.Object3D();
    const pColor = new THREE.Color(0x00aaff);

    const s = Math.ceil(Math.pow(count, 1 / 3));
    const sep = 2.3;
    const off = (s * sep) / 2;

    const targets = [];
    for (let i = 0; i < count; i++) {
      const z = Math.floor(i / (s * s));
      const y = Math.floor((i % (s * s)) / s);
      const x = i % s;

      const tx = x * sep - off;
      const ty = y * sep - off;
      const tz = z * sep - off;
      targets.push(new THREE.Vector3(tx, ty, tz));

      positions.push(
        new THREE.Vector3(
          tx + (Math.random() - 0.5) * 14,
          ty + (Math.random() - 0.5) * 14,
          tz + (Math.random() - 0.5) * 14
        )
      );
      swarm.setColorAt(i, pColor);
    }

    swarm.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(swarm);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));

    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.85,
      0.35,
      0.15
    );
    composer.addPass(bloomPass);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.4;
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 20;
    controls.maxDistance = 150;
    controls.enabled = false; // enabled once the full intro sequence finishes

    const clock = new THREE.Clock();
    let sequenceDone = false;

    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

    const t1Start = STAGE1_DELAY;
    const t1End   = t1Start + STAGE1_DURATION;
    const t2Start = t1End + HOLD1_DURATION;
    const t2End   = t2Start + STAGE2_DURATION;
    const t3Start = t2End + HOLD2_DURATION;
    const t3End   = t3Start + STAGE3_DURATION;

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();

      for (let i = 0; i < count; i++) {
        positions[i].lerp(targets[i], 0.35);
        dummy.position.copy(positions[i]);
        dummy.rotation.x = elapsed * 0.3 + i * 0.0003;
        dummy.rotation.y = elapsed * 0.4 + i * 0.00025;
        dummy.updateMatrix();
        swarm.setMatrixAt(i, dummy.matrix);
      }
      swarm.instanceMatrix.needsUpdate = true;
      if (swarm.instanceColor) swarm.instanceColor.needsUpdate = true;

      if (!sequenceDone) {
        let dist;
        if (elapsed < t1Start) {
          dist = DIST_FAR;
        } else if (elapsed < t1End) {
          const t = (elapsed - t1Start) / STAGE1_DURATION;
          dist = DIST_FAR + (DIST_STAGE1 - DIST_FAR) * easeOutCubic(t);
        } else if (elapsed < t2Start) {
          dist = DIST_STAGE1;
        } else if (elapsed < t2End) {
          const t = (elapsed - t2Start) / STAGE2_DURATION;
          dist = DIST_STAGE1 + (DIST_STAGE2 - DIST_STAGE1) * easeOutCubic(t);
        } else if (elapsed < t3Start) {
          dist = DIST_STAGE2;
        } else if (elapsed < t3End) {
          const t = (elapsed - t3Start) / STAGE3_DURATION;
          dist = DIST_STAGE2 + (DIST_FULL - DIST_STAGE2) * easeOutCubic(t);
        } else {
          dist = DIST_FULL;
          sequenceDone = true;
          controls.enabled = true;
          controls.autoRotate = true;
        }
        camera.position.copy(camPosAtDistance(dist));
        camera.lookAt(0, 0, 0);
      } else {
        controls.update();
      }

      composer.render();
    }

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
